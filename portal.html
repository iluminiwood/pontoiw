<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>IW Ponto · Portal do Colaborador</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --bg:#0c0e12; --s1:#12141a; --s2:#1c1f27; --b1:#23282a;
    --t1:#e8e8ec; --t2:#8a8a9a; --t3:#6a6a7a;
    --acc:#10b981; --g:#3dd68c; --r:#f87171; --o:#f59e0b;
    --mono:'SF Mono',ui-monospace,Menlo,monospace;
  }
  body{background:var(--bg);color:var(--t1);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh}
  .wrap{max-width:440px;margin:0 auto;padding:1.25rem}
  .hidden{display:none!important}

  /* Login */
  .login-box{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:2rem 1.5rem;max-width:400px;margin:0 auto}
  .brand{text-align:center;margin-bottom:2rem}
  .brand-logo{font-size:22px;font-weight:800;color:var(--acc);letter-spacing:1px}
  .brand-sub{font-size:12px;color:var(--t2);margin-top:4px}
  label{font-size:11px;color:var(--t2);display:block;margin-bottom:6px}
  input{width:100%;background:var(--s2);border:1px solid var(--b1);border-radius:10px;padding:12px;font-size:15px;color:var(--t1);font-family:inherit;margin-bottom:14px;outline:none}
  input:focus{border-color:var(--acc)}
  input.mono{font-family:var(--mono);letter-spacing:1px}
  .btn{width:100%;background:var(--acc);color:#fff;border:none;border-radius:10px;padding:13px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn:active{opacity:.85}
  .btn:disabled{opacity:.5}
  .err{font-size:12px;color:var(--r);text-align:center;margin-bottom:12px;min-height:16px}
  .hint{font-size:11px;color:var(--t3);text-align:center;margin-top:16px;line-height:1.5}

  /* Portal */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:1.15rem 1.25rem;border-bottom:.5px solid var(--b1)}
  .topbar .u{display:flex;align-items:center;gap:13px}
  .avatar{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#30d158,#248a3d);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:20px}
  .uname{font-size:15px;font-weight:800}
  .usub{font-size:11px;color:var(--t2)}
  .logout{font-size:12px;color:var(--r);background:none;border:1px solid rgba(248,113,113,.3);border-radius:8px;padding:6px 12px;cursor:pointer}

  .saldo-card{background:linear-gradient(135deg,#0d2a1e,#0a1f17);border:.5px solid #14503f;border-radius:18px;padding:1.5rem;margin-bottom:1rem;text-align:center}
  .saldo-lbl{font-size:11px;color:var(--t2);text-transform:uppercase}
  .saldo-val{font-size:34px;font-weight:900;font-family:var(--mono);margin-top:4px}
  .saldo-per{font-size:11px;color:var(--t3);margin-top:4px}

  .stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:1rem}
  .stat{background:var(--s2);border-radius:14px;padding:.85rem;text-align:center;border:1px solid transparent}
  .stat.clicavel{cursor:pointer}
  .stat.clicavel:active{opacity:.7}
  .stat.ativo{border-color:var(--acc);background:rgba(16,185,129,.1)}
  .stat-v{font-size:18px;font-weight:800;font-family:var(--mono)}
  .stat-l{font-size:10px;color:var(--t3);margin-top:2px}

  .sec-title{font-size:11px;color:var(--t2);text-transform:uppercase;margin:1.25rem 0 8px}
  .dia{background:var(--s2);border-radius:12px;padding:.7rem .9rem;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .dia-data{font-size:12px;color:var(--t1);white-space:nowrap}
  .dia-bat{font-size:11px;color:var(--t2);font-family:var(--mono);text-align:right;flex:1}
  .dia-row{background:var(--s2);border-radius:12px;padding:.7rem .9rem;margin-bottom:6px}
  .dia-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
  .dia-top .dia-data{font-size:13px;color:var(--t1);font-weight:600}
  .dia-top .dia-saldo{font-size:13px;font-family:var(--mono);font-weight:600}
  .dia-bot{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .dia-bot .dia-bat{font-size:12px;color:var(--t2);font-family:var(--mono);text-align:left;flex:none}
  .dia-saldo{font-size:12px;font-family:var(--mono);white-space:nowrap;min-width:52px;text-align:right}
  .etq{font-size:11px;padding:2px 8px;border-radius:6px}
  .etq.falta{background:rgba(248,113,113,.12);color:var(--r)}
  .etq.ferias{background:rgba(127,119,221,.15);color:#a99df5}
  .etq.folga{background:rgba(56,189,248,.12);color:#7dd3fc}
  .etq.atraso{background:rgba(245,158,11,.15);color:var(--o);font-size:10px}

  .adv{background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.2);border-radius:10px;padding:.7rem .8rem;margin-bottom:6px}
  .adv-top{font-size:13px;color:var(--t1);font-weight:600}
  .adv-sub{font-size:11px;color:var(--t2);margin-top:2px}
  .adv-ok{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.2);border-radius:10px;padding:.7rem .8rem;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--t1)}
  .loading{text-align:center;color:var(--t3);padding:2rem;font-size:13px}
  .per-sel{display:flex;gap:6px;margin-bottom:1rem;flex-wrap:wrap}
  .per-btn{flex:1;background:var(--s2);border:1px solid var(--b1);border-radius:8px;padding:8px;font-size:12px;color:var(--t2);cursor:pointer;text-align:center}
  .ano-sep{font-size:15px;font-weight:700;color:var(--t1);margin:1.25rem 0 .6rem;padding-left:2px;letter-spacing:-.2px}
  .ano-sep:first-child{margin-top:.25rem}
  .fim-lista{text-align:center;font-size:12px;color:var(--t3);padding:1.25rem 0 .5rem;font-family:var(--mono)}
  .felic-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:center;justify-content:center;z-index:100;padding:1.5rem;backdrop-filter:blur(4px)}
  .felic-overlay.open{display:flex;animation:felicFade .3s ease}
  @keyframes felicFade{from{opacity:0}to{opacity:1}}
  .felic-card{background:var(--s1);border-radius:24px;padding:2.5rem 1.75rem 2rem;text-align:center;max-width:340px;width:100%;animation:felicPop .4s cubic-bezier(.2,.9,.3,1.3)}
  @keyframes felicPop{from{transform:scale(.85);opacity:0}to{transform:scale(1);opacity:1}}
  .felic-emoji{font-size:56px;margin-bottom:1rem;line-height:1}
  .felic-titulo{font-size:21px;font-weight:700;letter-spacing:-.3px;margin-bottom:.6rem}
  .felic-texto{font-size:14px;color:var(--t2);line-height:1.6;margin-bottom:1.75rem}
  .felic-btn{width:100%;background:var(--acc);color:#fff;border:none;border-radius:14px;padding:14px;font-size:15px;font-weight:600;cursor:pointer;font-family:inherit}
  .felic-btn:active{transform:scale(.97)}
  .per-btn.on{background:rgba(16,185,129,.15);border-color:var(--acc);color:var(--acc)}
</style>
</head>
<body>

<!-- ===== LOGIN ===== -->
<div id="tela-login" class="login-box">
  <div class="brand">
    <div class="brand-logo">IW · PONTO</div>
    <div class="brand-sub">Portal do colaborador</div>
  </div>
  <label>CPF</label>
  <input type="tel" id="l-cpf" class="mono" placeholder="Só números" maxlength="11" inputmode="numeric">
  <label>Senha</label>
  <input type="password" id="l-senha" placeholder="Sua senha" onkeydown="if(event.key==='Enter')fazerLogin()">
  <div class="err" id="l-err"></div>
  <button class="btn" id="l-btn" onclick="fazerLogin()">Entrar</button>
  <div class="hint">Primeiro acesso? Use a senha provisória que a empresa te entregou.</div>
</div>

<!-- ===== TROCA DE SENHA (1º acesso) ===== -->
<div id="tela-troca" class="login-box hidden">
  <div class="brand">
    <div class="brand-logo">Criar sua senha</div>
    <div class="brand-sub">No primeiro acesso, escolha uma senha só sua</div>
  </div>
  <label>Nova senha (mín. 4 caracteres)</label>
  <input type="password" id="t-nova" placeholder="Escolha uma senha">
  <label>Repita a nova senha</label>
  <input type="password" id="t-nova2" placeholder="Digite de novo" onkeydown="if(event.key==='Enter')trocarSenha()">
  <div class="err" id="t-err"></div>
  <button class="btn" id="t-btn" onclick="trocarSenha()">Salvar e entrar</button>
</div>

<!-- ===== PORTAL ===== -->
<div id="tela-portal" class="hidden">
  <div class="topbar">
    <div class="u">
      <div class="avatar" id="p-inicial">?</div>
      <div>
        <div class="uname" id="p-nome">—</div>
        <div class="usub" id="p-periodo">—</div>
      </div>
    </div>
    <button class="logout" onclick="sair()">Sair</button>
  </div>
  <div class="wrap">
    <div class="per-sel">
      <div class="per-btn on" data-per="mes" onclick="mudarPeriodo('mes')">Este mês</div>
      <div class="per-btn" data-per="mes-ant" onclick="mudarPeriodo('mes-ant')">Mês passado</div>
      <div class="per-btn" data-per="custom" onclick="mudarPeriodo('custom')">Escolher datas</div>
    </div>
    <div id="per-custom" class="hidden" style="display:flex;gap:8px;align-items:center;margin-bottom:1rem">
      <input type="date" id="per-de" onchange="aplicarPeriodoCustom()" style="margin-bottom:0;flex:1;padding:9px;font-size:13px">
      <span style="font-size:12px;color:var(--t3)">até</span>
      <input type="date" id="per-ate" onchange="aplicarPeriodoCustom()" style="margin-bottom:0;flex:1;padding:9px;font-size:13px">
    </div>
    <div id="p-conteudo"><div class="loading">Carregando seus dados...</div></div>
  </div>
</div>

<script>
const SB_URL='https://mcoemytfdrfrtbfbpvqr.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1jb2VteXRmZHJmcnRiZmJwdnFyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk3OTgyODcsImV4cCI6MjA5NTM3NDI4N30.uJZKW5oUlexLo_XENDCohlchGKlG54Pwt0gvqpuy-i8';
const sb=supabase.createClient(SB_URL,SB_KEY);

let colab=null; // {cpf, nome, funcionario_id}
let periodoAtual='mes';
let filtroDias=null; // null | 'falta' | 'atraso' — filtra a lista de dias

// Sets de dias especiais (preenchidos do servidor)
let diasFeriasCpf=new Set();
let diasFolgaCompCpf=new Set();
let diasAfastamentoCpf=new Set();
let feriados=new Set();

// Jornada da empresa (preenchida do servidor)
let JORNADA={1:540,2:540,3:540,4:540,5:480,0:0,6:0};
let TOL=5, ENTRADA_PAD='07:00', SAIDA_SEMANA='17:30', SAIDA_SEX='16:30';

// ===== Funções de cálculo (mesmas do app, pra o saldo bater) =====
function toMin(hhmm){if(!hhmm)return 0;const[h,m]=hhmm.split(':').map(Number);return h*60+m;}
function fromMin(min){const neg=min<0,abs=Math.abs(min);const h=Math.floor(abs/60),m=abs%60;return (neg?'-':'+')+h+'h'+(m?(m<10?'0':'')+m+'min':'');}
function fmtData(ds){const d=new Date(ds+'T12:00:00');return ['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'][d.getDay()]+' '+d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});}
function isFeriado(ds){return feriados.has(ds);}
function isDiaUtil(ds){const dw=new Date(ds+'T12:00:00').getDay();return dw>=1&&dw<=5&&!isFeriado(ds);}
function jornadaMin(ds){return JORNADA[new Date(ds+'T12:00:00').getDay()]||0;}
function isDiaCompleto(ds){const hoje=new Date().toISOString().split('T')[0];return ds<hoje;}
function calcTrab(bats){
  const s=[...bats].sort((a,b)=>a.hora.localeCompare(b.hora));
  let t=0;
  for(let i=0;i<s.length-1;i++){
    if(s[i].tipo==='ENTRADA'&&s[i+1].tipo==='SAIDA'){t+=toMin(s[i+1].hora)-toMin(s[i].hora);i++;}
  }
  return t;
}
function saldoDoDia(ds, bats, cpf){
  const trab=(bats&&bats.length)?calcTrab(bats):0;
  if(cpf&&diasFolgaCompCpf.has(cpf+'_'+ds)){const j=jornadaMin(ds);return {classe:'folga_comp',saldo:-j,trab:0,jornada:j,conta:j>0};}
  if(cpf&&(diasFeriasCpf.has(cpf+'_'+ds)||diasAfastamentoCpf.has(cpf+'_'+ds))){return {classe:'excluido',saldo:0,trab,jornada:0,conta:false};}
  if(isDiaUtil(ds)){
    const j=jornadaMin(ds);
    const hojeStr=new Date().toISOString().split('T')[0];
    if(!bats||!bats.length)return {classe:'util',saldo:0,trab:0,jornada:j,conta:false,semBatida:true};
    if(!isDiaCompleto(ds)){
      if(ds>=hojeStr)return {classe:'util',saldo:0,trab,jornada:j,conta:false,emAndamento:true};
      return {classe:'util',saldo:trab-j,trab,jornada:j,conta:false,incompleto:true};
    }
    return {classe:'util',saldo:trab-j,trab,jornada:j,conta:true};
  }
  if(trab>0)return {classe:'folga',saldo:trab,trab,jornada:0,conta:true};
  return {classe:'folga',saldo:0,trab:0,jornada:0,conta:false,semBatida:true};
}
function getPeriodo(p){
  const hoje=new Date(),hs=hoje.toISOString().split('T')[0];
  if(p==='mes'){const m=hoje.toISOString().slice(0,7);return{ini:m+'-01',fim:hs};}
  if(p==='mes-ant'){
    const ma=new Date(hoje.getFullYear(),hoje.getMonth()-1,1);
    const mf=new Date(hoje.getFullYear(),hoje.getMonth(),0);
    return{ini:ma.toISOString().split('T')[0],fim:mf.toISOString().split('T')[0]};
  }
  if(p==='custom'){
    const de=document.getElementById('per-de')?.value;
    const ate=document.getElementById('per-ate')?.value;
    if(de&&ate) return{ini:de<=ate?de:ate, fim:de<=ate?ate:de};
    if(de) return{ini:de,fim:hs};
    const m=hoje.toISOString().slice(0,7);return{ini:m+'-01',fim:hs};
  }
  const m=hoje.toISOString().slice(0,7);return{ini:m+'-01',fim:hs};
}

// ===== Login =====
async function fazerLogin(){
  const cpf=document.getElementById('l-cpf').value.replace(/\D/g,'');
  const senha=document.getElementById('l-senha').value;
  const err=document.getElementById('l-err');
  const btn=document.getElementById('l-btn');
  err.textContent='';
  if(cpf.length!==11){err.textContent='Digite os 11 números do CPF.';return;}
  if(!senha){err.textContent='Digite a senha.';return;}
  btn.disabled=true;btn.textContent='Entrando...';
  const {data,error}=await sb.rpc('login_colaborador',{p_cpf:cpf,p_senha:senha});
  btn.disabled=false;btn.textContent='Entrar';
  if(error||!data?.ok){err.textContent=data?.erro||'Erro ao entrar. Tente de novo.';return;}
  colab={cpf,nome:data.nome||'Colaborador',funcionario_id:data.funcionario_id,admissao:data.admissao,aniversario:data.aniversario};
  if(data.precisa_trocar){
    document.getElementById('tela-login').classList.add('hidden');
    document.getElementById('tela-troca').classList.remove('hidden');
    return;
  }
  entrarPortal();
}

// ===== Troca de senha =====
async function trocarSenha(){
  const nova=document.getElementById('t-nova').value;
  const nova2=document.getElementById('t-nova2').value;
  const err=document.getElementById('t-err');
  const btn=document.getElementById('t-btn');
  err.textContent='';
  if(nova.length<4){err.textContent='A senha deve ter ao menos 4 caracteres.';return;}
  if(nova!==nova2){err.textContent='As senhas não são iguais.';return;}
  btn.disabled=true;btn.textContent='Salvando...';
  const senhaAtual=document.getElementById('l-senha').value;
  const {data,error}=await sb.rpc('trocar_senha_colaborador',{p_cpf:colab.cpf,p_senha_atual:senhaAtual,p_senha_nova:nova});
  btn.disabled=false;btn.textContent='Salvar e entrar';
  if(error||!data?.ok){err.textContent=data?.erro||'Erro ao trocar senha.';return;}
  document.getElementById('tela-troca').classList.add('hidden');
  entrarPortal();
}

// ===== Entrar no portal =====
async function entrarPortal(){
  document.getElementById('tela-login').classList.add('hidden');
  document.getElementById('tela-troca').classList.add('hidden');
  document.getElementById('tela-portal').classList.remove('hidden');
  document.getElementById('p-nome').textContent='Olá, '+colab.nome.split(' ')[0];
  document.getElementById('p-inicial').textContent=colab.nome[0].toUpperCase();
  await carregarConfig();
  await carregarDados();
  checarFelicitacoes();
}

// ===== FELICITAÇÕES (pop-up ao entrar) =====
function checarFelicitacoes(){
  const hoje=new Date();
  const hojeStr=hoje.toISOString().split('T')[0];
  const primeiroNome=colab.nome.split(' ')[0];
  let msg=null, chaveVista=null;

  // 1) Aniversário — só no dia exato
  if(colab.aniversario){
    // aniversario pode vir 'YYYY-MM-DD' ou 'MM-DD' ou 'DD/MM'
    const a=String(colab.aniversario);
    let mm=null, dd=null;
    if(/^\d{4}-\d{2}-\d{2}$/.test(a)){ [,mm,dd]=a.split('-'); }
    else if(/^\d{2}-\d{2}$/.test(a)){ [mm,dd]=a.split('-'); }
    else if(/^\d{2}\/\d{2}$/.test(a)){ [dd,mm]=a.split('/'); }
    if(mm&&dd){
      const hojeMM=String(hoje.getMonth()+1).padStart(2,'0');
      const hojeDD=String(hoje.getDate()).padStart(2,'0');
      if(mm===hojeMM && dd===hojeDD){
        msg={emoji:'🎉', titulo:'Feliz aniversário, '+primeiroNome+'!',
             texto:'A equipe toda deseja um dia incrível pra você. Aproveite muito! 🎂'};
        chaveVista='aniv_'+hojeStr;
      }
    }
  }

  // 2) Efetivação — nos 7 dias após completar 90 dias de experiência (uma vez)
  if(!msg && colab.admissao){
    const adm=new Date(colab.admissao+'T12:00:00');
    if(!isNaN(adm)){
      const fim=new Date(adm); fim.setDate(fim.getDate()+90); // fim da experiência
      const diasDesde=Math.floor((hoje-fim)/(1000*60*60*24));
      if(diasDesde>=0 && diasDesde<=7){
        msg={emoji:'🎊', titulo:'Parabéns, '+primeiroNome+'!',
             texto:'Você concluiu seu período de experiência e agora é parte efetiva da equipe. Que venham muitas conquistas! 💪'};
        chaveVista='efetiv_'+colab.cpf;
      }
    }
  }

  if(!msg) return;
  // Mostra só uma vez (guarda no navegador que já viu)
  try{ if(localStorage.getItem('felic_'+chaveVista)) return; }catch(e){}
  try{ localStorage.setItem('felic_'+chaveVista,'1'); }catch(e){}
  mostrarFelicitacao(msg);
}

function mostrarFelicitacao(msg){
  const ov=document.getElementById('felic-overlay');
  document.getElementById('felic-emoji').textContent=msg.emoji;
  document.getElementById('felic-titulo').textContent=msg.titulo;
  document.getElementById('felic-texto').textContent=msg.texto;
  ov.classList.add('open');
}
function fecharFelicitacao(){
  document.getElementById('felic-overlay').classList.remove('open');
}

async function carregarConfig(){
  // Config da empresa (jornada + feriados) e dias especiais — pro cálculo bater
  const {data:cfg}=await sb.rpc('portal_config_empresa',{p_cpf:colab.cpf});
  if(cfg?.ok){
    const e=cfg.empresa||{};
    ENTRADA_PAD=e.jornada_entrada||ENTRADA_PAD;
    SAIDA_SEMANA=e.jornada_saida||SAIDA_SEMANA;
    SAIDA_SEX=e.jornada_saida_sexta||SAIDA_SEX;
    if(e.tolerancia_min!=null)TOL=e.tolerancia_min;
    // Monta a jornada em minutos por dia da semana
    const jSemana=diffMin(e.jornada_entrada||'07:00',e.jornada_almoco_ini||'12:00')+diffMin(e.jornada_almoco_fim||'13:30',e.jornada_saida||'17:30');
    const jSexta=diffMin(e.jornada_entrada||'07:00',e.jornada_almoco_ini||'12:00')+diffMin(e.jornada_almoco_fim||'13:30',e.jornada_saida_sexta||'16:30');
    JORNADA={1:jSemana,2:jSemana,3:jSemana,4:jSemana,5:jSexta,0:0,6:0};
    feriados=new Set((cfg.feriados||[]));
    // Garante a admissão (mesmo que o login não tenha trazido)
    if(cfg.admissao && !colab.admissao) colab.admissao=String(cfg.admissao).split('T')[0];
  }
  const {data:esp}=await sb.rpc('portal_meus_dias_especiais',{p_cpf:colab.cpf});
  if(esp?.ok){
    diasFeriasCpf=new Set((esp.ferias_dias||[]).map(d=>colab.cpf+'_'+d.data));
    diasAfastamentoCpf=new Set((esp.afastamentos_dias||[]).map(d=>colab.cpf+'_'+d.data));
  }
}
function diffMin(h1,h2){return toMin(h2)-toMin(h1);}

// Card de período de experiência (motivacional)
function cardExperiencia(){
  if(!colab.admissao) return '';
  const adm=new Date(colab.admissao+'T12:00:00');
  if(isNaN(adm)) return '';
  const hoje=new Date();
  const fimExp=new Date(adm); fimExp.setDate(fimExp.getDate()+90);
  const diasRest=Math.ceil((fimExp-hoje)/(1000*60*60*24));
  if(diasRest<=0) return ''; // já efetivado, não mostra
  const fimStr=fimExp.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric'});
  return `<div style="background:linear-gradient(135deg,#1a2440,#141c30);border:.5px solid #2a3a5c;border-radius:18px;padding:1.25rem;margin-bottom:1rem">
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <span style="font-size:18px">🌱</span>
      <span style="font-size:13px;font-weight:700;color:#7db3f5">Período de experiência</span>
    </div>
    <div style="font-size:15px;color:var(--t1);line-height:1.5;margin-bottom:6px">
      Faltam <b style="color:#7db3f5">${diasRest} ${diasRest>1?'dias':'dia'}</b> para o fim da sua experiência.
    </div>
    <div style="font-size:12.5px;color:var(--t2);line-height:1.5">
      Aproveite este período para se desenvolver, mostrar seu trabalho e se integrar à equipe. Conte com a gente! 💪
    </div>
    <div style="font-size:11px;color:var(--t3);margin-top:8px">Efetivação prevista para ${fimStr}</div>
  </div>`;
}

async function carregarDados(){
  const cont=document.getElementById('p-conteudo');
  cont.innerHTML='<div class="loading">Carregando seus dados...</div>';
  const {ini,fim}=getPeriodo(periodoAtual);
  document.getElementById('p-periodo').textContent=fmtData(ini).split(' ')[1]+' a '+fmtData(fim).split(' ')[1];

  // Batidas do período
  const {data:bd}=await sb.rpc('portal_minhas_batidas',{p_cpf:colab.cpf,p_ini:ini,p_fim:fim});
  const batidas=(bd?.ok?bd.batidas:[])||[];
  // Advertências
  const {data:ad}=await sb.rpc('portal_minhas_advertencias',{p_cpf:colab.cpf});
  const advs=(ad?.ok?ad.advertencias:[])||[];
  // Acertos (pagamentos de horas) — para não somar horas já pagas
  const {data:ac}=await sb.rpc('portal_meus_acertos',{p_cpf:colab.cpf});
  const acertos=(ac?.ok?ac.acertos:[])||[];
  // Corte: o saldo só conta a partir do dia SEGUINTE ao último período pago
  let corteSaldo=null, ultimoAcertoFim=null;
  acertos.forEach(a=>{
    if(a.periodo_fim && (!ultimoAcertoFim || a.periodo_fim>ultimoAcertoFim)){
      ultimoAcertoFim=a.periodo_fim;
    }
  });
  if(ultimoAcertoFim){
    const d=new Date(ultimoAcertoFim+'T12:00:00'); d.setDate(d.getDate()+1);
    corteSaldo=d.toISOString().split('T')[0];
  }

  // Agrupa batidas por dia
  const porDia={};
  batidas.forEach(b=>{
    if(!porDia[b.data_local])porDia[b.data_local]=[];
    porDia[b.data_local].push({hora:b.data_hora_local?.slice(11,16)||'00:00',tipo:b.tipo});
  });

  // Percorre os dias do período, calcula saldo, faltas, atrasos
  let saldoTotal=0, diasTrab=0;
  const diasFalta=[], diasAtraso=[];
  const linhas=[];
  const hoje=new Date().toISOString().split('T')[0];
  for(let d=new Date(ini+'T12:00:00');d<=new Date(fim+'T12:00:00');d.setDate(d.getDate()+1)){
    const ds=d.toISOString().split('T')[0];
    // Não conta nada antes da admissão do colaborador (ele não trabalhava aqui ainda)
    if(colab.admissao && ds < colab.admissao) continue;
    const bats=porDia[ds];
    const r=saldoDoDia(ds,bats,colab.cpf);
    let etq='', ehFalta=false, ehAtraso=false, minAtraso=0;
    if(bats&&bats.length){
      diasTrab++;
      const ent=bats.filter(b=>b.tipo==='ENTRADA').sort((a,b)=>a.hora.localeCompare(b.hora))[0];
      if(ent&&toMin(ent.hora)<=toMin('10:00')&&toMin(ent.hora)-toMin(ENTRADA_PAD)>TOL){
        ehAtraso=true; minAtraso=toMin(ent.hora)-toMin(ENTRADA_PAD);
        diasAtraso.push(ds);
      }
    } else if(diasFeriasCpf.has(colab.cpf+'_'+ds)){
      etq='<span class="etq ferias">Férias</span>';
    } else if(diasFolgaCompCpf.has(colab.cpf+'_'+ds)){
      etq='<span class="etq folga">Folga</span>';
    } else if(diasAfastamentoCpf.has(colab.cpf+'_'+ds)){
      etq='<span class="etq folga">Atestado</span>';
    } else if(isDiaUtil(ds)&&ds<hoje){
      etq='<span class="etq falta">Falta</span>'; ehFalta=true; diasFalta.push(ds);
    } else {
      continue; // fim de semana/feriado sem batida: pula
    }
    // Saldo: só conta a partir do dia seguinte ao último acerto (horas pagas não somam)
    if(r.conta && (!corteSaldo || ds>=corteSaldo)) saldoTotal+=r.saldo;

    // Aplica o filtro (se o usuário clicou em faltas ou atrasos)
    if(filtroDias==='falta'&&!ehFalta) continue;
    if(filtroDias==='atraso'&&!ehAtraso) continue;

    const batStr=bats&&bats.length?bats.sort((a,b)=>a.hora.localeCompare(b.hora)).map(b=>b.hora).join(' · '):etq;
    const mostraSaldo=r.conta||(r.classe==='folga_comp');
    const marcaAtraso=ehAtraso?`<span class="etq atraso">atraso +${minAtraso}min</span>`:'';
    const saldoTxt=mostraSaldo?fromMin(r.saldo):'—';
    const saldoCor=!mostraSaldo?'var(--t3)':r.saldo>=0?'var(--g)':'var(--r)';
    linhas.push({ds, html:`<div class="dia-row">
      <div class="dia-top">
        <span class="dia-data">${fmtData(ds)}</span>
        <span class="dia-saldo" style="color:${saldoCor}">${saldoTxt}</span>
      </div>
      <div class="dia-bot">
        <span class="dia-bat">${batStr}</span>
        ${marcaAtraso}
      </div>
    </div>`});
  }
  const faltas=diasFalta.length, atrasos=diasAtraso.length;

  linhas.reverse(); // mais recente no topo

  // Agrupa por ANO com cabeçalho (evita lista infinita corrida)
  let listaDiasHtml='';
  if(linhas.length){
    let anoAtual=null;
    linhas.forEach(l=>{
      const ano=l.ds.split('-')[0];
      if(ano!==anoAtual){
        anoAtual=ano;
        listaDiasHtml+=`<div class="ano-sep">${ano}</div>`;
      }
      listaDiasHtml+=l.html;
    });
    // Mensagem de fim da lista
    listaDiasHtml+='<div class="fim-lista">— fim do histórico —</div>';
  } else {
    listaDiasHtml='<div class="loading">Nenhum dia neste período.</div>';
  }

  // Advertências — o app grava: tipo, descricao, data_registro, criado_em
  let advHtml;
  if(advs.length){
    const plural=advs.length>1?'advertências':'advertência';
    advHtml=`<div class="adv" style="display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:14px;color:var(--t1)">Você tem <b style="color:var(--r)">${advs.length}</b> ${plural} registrada${advs.length>1?'s':''}</span>
      <span style="font-size:22px;font-weight:800;color:var(--r);font-family:var(--mono)">${advs.length}</span>
    </div>
    <div style="font-size:11px;color:var(--t3);margin-top:6px;padding:0 2px">Procure o RH ou seu encarregado para mais detalhes.</div>`;
  } else {
    advHtml='<div class="adv-ok"><span>Nenhuma advertência</span><span style="color:var(--g)">✓</span></div>';
  }

  // Cabeçalho da lista: mostra se está filtrado
  let tituloLista='Minhas batidas';
  let limparBtn='';
  if(filtroDias==='falta'){ tituloLista='Meus dias de falta'; limparBtn='<span onclick="limparFiltro()" style="color:var(--acc);cursor:pointer;text-transform:none;font-size:11px"> · ver tudo</span>'; }
  if(filtroDias==='atraso'){ tituloLista='Meus dias com atraso'; limparBtn='<span onclick="limparFiltro()" style="color:var(--acc);cursor:pointer;text-transform:none;font-size:11px"> · ver tudo</span>'; }

  cont.innerHTML=`
    ${cardExperiencia()}
    <div class="saldo-card">
      <div class="saldo-lbl">Saldo do banco de horas</div>
      <div class="saldo-val" style="color:${saldoTotal>=0?'var(--g)':'var(--r)'}">${fromMin(saldoTotal)}</div>
      <div class="saldo-per">no período selecionado</div>
      ${(ultimoAcertoFim && corteSaldo && ini<corteSaldo)?`<div style="margin-top:.75rem;padding-top:.75rem;border-top:.5px solid rgba(255,255,255,.08);font-size:11.5px;color:#8fd9b8;line-height:1.5">✓ As horas até ${fmtData(ultimoAcertoFim)} já foram acertadas. O saldo acima conta a partir daí.</div>`:''}
    </div>
    <div class="stats">
      <div class="stat"><div class="stat-v">${diasTrab}</div><div class="stat-l">Dias trab.</div></div>
      <div class="stat ${atrasos?'clicavel':''} ${filtroDias==='atraso'?'ativo':''}" ${atrasos?'onclick="filtrarPor(\'atraso\')"':''}>
        <div class="stat-v" style="color:${atrasos?'var(--o)':'var(--t1)'}">${atrasos}</div>
        <div class="stat-l">Atrasos${atrasos?' ›':''}</div>
      </div>
      <div class="stat ${faltas?'clicavel':''} ${filtroDias==='falta'?'ativo':''}" ${faltas?'onclick="filtrarPor(\'falta\')"':''}>
        <div class="stat-v" style="color:${faltas?'var(--r)':'var(--t1)'}">${faltas}</div>
        <div class="stat-l">Faltas${faltas?' ›':''}</div>
      </div>
    </div>
    <div class="sec-title">${tituloLista}${limparBtn}</div>
    ${listaDiasHtml}
    <div class="sec-title">Advertências</div>
    ${advHtml}`;
}

function filtrarPor(tipo){
  filtroDias = (filtroDias===tipo) ? null : tipo; // clicar de novo limpa
  carregarDados();
}
function limparFiltro(){
  filtroDias=null;
  carregarDados();
}

function mudarPeriodo(p){
  periodoAtual=p;
  filtroDias=null; // limpa filtro de faltas/atrasos ao trocar período
  document.querySelectorAll('.per-btn').forEach(b=>b.classList.toggle('on',b.dataset.per===p));
  const box=document.getElementById('per-custom');
  if(p==='custom'){
    box.classList.remove('hidden');
    // Pré-preenche com o mês atual se ainda estiver vazio
    const de=document.getElementById('per-de'), ate=document.getElementById('per-ate');
    if(!de.value){
      const h=new Date();
      de.value=h.toISOString().slice(0,7)+'-01';
      ate.value=h.toISOString().split('T')[0];
    }
    carregarDados();
  } else {
    box.classList.add('hidden');
    carregarDados();
  }
}
function aplicarPeriodoCustom(){
  const de=document.getElementById('per-de').value;
  const ate=document.getElementById('per-ate').value;
  if(de&&ate){ filtroDias=null; carregarDados(); }
}

function sair(){
  colab=null;
  document.getElementById('tela-portal').classList.add('hidden');
  document.getElementById('tela-login').classList.remove('hidden');
  document.getElementById('l-cpf').value='';
  document.getElementById('l-senha').value='';
  document.getElementById('l-err').textContent='';
}
</script>
